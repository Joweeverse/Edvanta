# API Gateway kelasdigital: satu pintu masuk untuk core-service

# 1) Kunci API milik kelompok lain (server ke server): daftar ada di api_keys.conf
map $http_x_api_key $key_valid {
  default 0;
  include /etc/nginx/api_keys.conf;
}

# 2) Pengguna aplikasi membawa JWT (PocketBase yang memeriksa keabsahannya)
map $http_authorization $has_bearer {
  default 0;
  "~^Bearer .+" 1;
}

# 3) Boleh lewat jika punya API key yang valid ATAU Bearer token
map "$key_valid$has_bearer" $allowed {
  "00" 0;
  default 1;
}

# IP asli pengguna (di belakang Cloudflare Tunnel)
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

limit_req_zone $client_ip zone=api:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80;
  client_max_body_size 5m;
  default_type application/json;

  limit_req zone=api burst=20 nodelay;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $client_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Terbuka: cek kesehatan
  location = /api/health {
    return 200 '{"gateway":"ok"}';
  }

  # Terbuka (dibatasi rate limit): daftar & login pengguna
  location /api/auth/ {
    proxy_pass http://core-service:8090/api/collections/users/;
  }

  # Butuh X-API-Key atau Bearer token
  location /api/classes {
    if ($allowed = 0) { return 401 '{"error":"X-API-Key atau Bearer token diperlukan"}'; }
    proxy_pass http://core-service:8090/api/collections/classes/records;
  }
  location /api/lessons {
    if ($allowed = 0) { return 401 '{"error":"X-API-Key atau Bearer token diperlukan"}'; }
    proxy_pass http://core-service:8090/api/collections/lessons/records;
  }
  location /api/quizzes {
    if ($allowed = 0) { return 401 '{"error":"X-API-Key atau Bearer token diperlukan"}'; }
    proxy_pass http://core-service:8090/api/collections/quizzes/records;
  }
  location /api/enrollments {
    if ($allowed = 0) { return 401 '{"error":"X-API-Key atau Bearer token diperlukan"}'; }
    proxy_pass http://core-service:8090/api/collections/enrollments/records;
  }
  location /api/attempts {
    if ($allowed = 0) { return 401 '{"error":"X-API-Key atau Bearer token diperlukan"}'; }
    proxy_pass http://core-service:8090/api/collections/attempts/records;
  }
  location /api/discussions {
    if ($allowed = 0) { return 401 '{"error":"X-API-Key atau Bearer token diperlukan"}'; }
    proxy_pass http://core-service:8090/api/collections/discussions/records;
  }
}
