volumes:
  core_data:            # database & file milik core-service

services:
  core-service:         # PocketBase: kelas, materi, kuis, pendaftaran, diskusi
    build: ./core-service
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - core_data:/pb_data
    ports:
      - "8094:8090"     # dashboard: http://IP_STB:8094/_/

  gateway:              # satu pintu masuk API (cek X-API-Key / Bearer token)
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    ports:
      - "8081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/api_keys.conf:/etc/nginx/api_keys.conf:ro
    depends_on:
      - core-service

  tunnel:               # Cloudflare Tunnel (aktif jika COMPOSE_PROFILES=tunnel di .env)
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - gateway
    profiles: ["tunnel"]
